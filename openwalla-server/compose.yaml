services:
  openwalla-server:
    build: .
    container_name: openwalla-server
    restart: unless-stopped
    ports:
      - "${OPENWALLA_API_PORT:-8080}:8080"
    environment:
      OPENWALLA_NETIFY_HOST: "${OPENWALLA_NETIFY_HOST:-192.168.1.1}"
      OPENWALLA_NETIFY_PORT: "${OPENWALLA_NETIFY_PORT:-7150}"
      OPENWALLA_ROUTER_LAN_IP: "${OPENWALLA_ROUTER_LAN_IP:-192.168.1.1}"
      OPENWALLA_RETENTION_HOURS: "${OPENWALLA_RETENTION_HOURS:-24}"
      OPENWALLA_API_TOKEN: "${OPENWALLA_API_TOKEN:-}"
    volumes:
      - ./data:/data

  openwalla-tunnel:
    profiles: ["tunnel"]
    build:
      context: .
      dockerfile: tunnel/Dockerfile
    container_name: openwalla-tunnel
    restart: unless-stopped
    ports:
      - "${OPENWALLA_TUNNEL_SSH_PORT:-2222}:22"
    environment:
      OPENWALLA_TUNNEL_USER: "${OPENWALLA_TUNNEL_USER:-openwalla}"
    volumes:
      - ./tunnel-data/authorized_keys:/config/authorized_keys:ro
      - ./tunnel-data/host-keys:/etc/ssh/keys
    networks:
      - default
      - openwalla-proxy

networks:
  openwalla-proxy:
    name: "${OPENWALLA_PROXY_NETWORK:-proxy}"
    external: true
